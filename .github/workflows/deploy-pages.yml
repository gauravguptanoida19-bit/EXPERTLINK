name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Client for GitHub Pages
        run: |
          npm run build:gh-pages
          cp apps/web/dist/expertlink-web/browser/index.html apps/web/dist/expertlink-web/browser/404.html
          touch apps/web/dist/expertlink-web/browser/.nojekyll


      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/dist/expertlink-web/browser
          branch: gh-pages
