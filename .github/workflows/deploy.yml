name: ExpertLink Deploy Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME_PREFIX }}/api:latest
            ${{ env.IMAGE_NAME_PREFIX }}/api:${{ github.sha }}

      - name: Build & Push ML Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ml-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME_PREFIX }}/ml-service:latest
            ${{ env.IMAGE_NAME_PREFIX }}/ml-service:${{ github.sha }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.IMAGE_NAME_PREFIX }}/web:latest
            ${{ env.IMAGE_NAME_PREFIX }}/web:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render/Railway Deploy Webhook
        run: |
          echo "Deploying ExpertLink release ${{ github.sha }}..."
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment webhook..."
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "Triggering Railway deployment..."
            # Railway CLI deploy invocation
            npm install -g @railway/cli
            railway up --service expertlink-api --detach
          else
            echo "No external deployment secret configured. Skipping webhook trigger."
          fi
