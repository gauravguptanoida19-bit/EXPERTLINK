name: ExpertLink CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: npx tsc --project apps/api/tsconfig.json --noEmit

  test-api:
    name: API Tests (with Services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expertlink
          POSTGRES_PASSWORD: expertlink_secret
          POSTGRES_DB: expertlink_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Push DB Schema
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://expertlink:expertlink_secret@localhost:5432/expertlink_db?schema=public

      - name: Run API Tests with Coverage
        run: npm run test:coverage --workspace=apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://expertlink:expertlink_secret@localhost:5432/expertlink_db?schema=public
          MONGODB_URI: mongodb://localhost:27017/expertlink_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-at-least-32-chars-long-here
          JWT_REFRESH_SECRET: test-refresh-secret-key-at-least-32-chars-long

  test-ml:
    name: ML Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Install dependencies
        working-directory: apps/ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: apps/ml-service
        run: pytest -v

  test-and-build-web:
    name: Web Client Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Angular Tests
        run: npm run test:web

      - name: Build Angular Client
        run: npm run build --workspace=apps/web

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, test-ml, test-and-build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          tags: expertlink-api:latest

      - name: Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ml-service
          push: false
          tags: expertlink-ml:latest

      - name: Build Web Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: expertlink-web:latest
